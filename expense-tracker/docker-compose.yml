services:
  app:
    build: .
    container_name: finance-tracker-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILE: prod
      DB_URL: jdbc:postgresql://db:5432/tracker
      DB_USER: tracker
      DB_PASS: tracker_pw
      DB_DRIVER: org.postgresql.Driver
      JWT_SECRET: ${JWT_SECRET:-Y2hhbmdlLW1lLXBsZWFzZS10aGlzLWlzLWEtbG9uZy1kZXYtb25seS1zZWNyZXQta2V5LWZvci1obWFjLXNoYTI1Ni1zaWduaW5n}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: finance-tracker-db
    environment:
      POSTGRES_DB: tracker
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker_pw
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d tracker"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
